
name: Instincta CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # ANDROID - KOTLIN & JETPACK COMPOSE
  # ==========================================

  android:
    name: Android (Kotlin & Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run Android Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: instincta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  # ==========================================
  # RUST - CORE & AXUM OAUTH PROXY
  # ==========================================

  rust:
    name: Rust Core & Axum OAuth Proxy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Automatically Format Rust Code
        run: cargo fmt --all

      - name: Verify Rust Formatting
        run: cargo fmt --all -- --check

      - name: Check Rust Workspace
        run: cargo check --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Workspace Tests
        run: cargo test --workspace
